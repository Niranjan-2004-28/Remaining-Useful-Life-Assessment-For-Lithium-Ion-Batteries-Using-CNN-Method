<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery RUL Prediction</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-light: #81C784;
            --primary-dark: #2E7D32;
            --accent: #03A9F4;
            --background: #f9f9f9;
            --card: #ffffff;
            --text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-in-out;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 28px;
            position: relative;
            z-index: 2;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
            position: relative;
            z-index: 2;
        }

        .animation-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .battery-icon {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 30px;
            border: 3px solid white;
            border-radius: 5px;
            position: relative;
            z-index: 2;
        }

        .battery-icon:after {
            content: '';
            position: absolute;
            right: -10px;
            top: 8px;
            width: 7px;
            height: 14px;
            background: white;
            border-radius: 0 3px 3px 0;
        }

        .battery-fill {
            position: absolute;
            left: 2px;
            top: 2px;
            height: calc(100% - 4px);
            width: 20%;
            background: white;
            border-radius: 2px 0 0 2px;
            animation: batteryCharge 3s infinite linear;
        }

        @keyframes batteryCharge {
            0% { width: 10%; background: #FF5252; }
            50% { width: 60%; background: #FFEB3B; }
            100% { width: 95%; background: #FFFFFF; }
        }

        .form-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }

        .form-col {
            flex: 1;
            padding: 0 10px;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: translateY(0);
        }

        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 5px;
            color: var(--accent);
            cursor: pointer;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
            font-weight: normal;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="header">
            <div class="animation-bg"></div>
            <h1>Battery Remaining Useful Life Prediction</h1>
            <p>Enter battery parameters to predict the remaining useful life</p>
            <div class="battery-icon">
                <div class="battery-fill"></div>
            </div>
        </div>
        
        <div class="form-content">
            <form id="batteryForm" action="/predict" method="POST">
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group" style="animation-delay: 0.1s;">
                            <label for="cycle_index">Cycle Index 
                                <span class="tooltip">ⓘ
                                    <span class="tooltiptext">The battery discharge-charge cycle count</span>
                                </span>
                            </label>
                            <input type="number" id="cycle_index" name="cycle_index" required step="any">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group" style="animation-delay: 0.2s;">
                            <label for="discharge_time">Discharge Time (s)
                                <span class="tooltip">ⓘ
                                    <span class="tooltiptext">Total time in seconds for battery discharge</span>
                                </span>
                            </label>
                            <input type="number" id="discharge_time" name="discharge_time" required step="any">
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group" style="animation-delay: 0.3s;">
                            <label for="decrement">Decrement 3.6-3.4V (s)
                                <span class="tooltip">ⓘ
                                    <span class="tooltiptext">Time taken for voltage to drop from 3.6V to 3.4V</span>
                                </span>
                            </label>
                            <input type="number" id="decrement" name="decrement" required step="any">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group" style="animation-delay: 0.4s;">
                            <label for="max_voltage">Max. Voltage Discharge (V)
                                <span class="tooltip">ⓘ
                                    <span class="tooltiptext">Maximum voltage during discharge cycle</span>
                                </span>
                            </label>
                            <input type="number" id="max_voltage" name="max_voltage" required step="any">
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group" style="animation-delay: 0.5s;">
                            <label for="min_voltage">Min. Voltage Charge (V)
                                <span class="tooltip">ⓘ
                                    <span class="tooltiptext">Minimum voltage during charging cycle</span>
                                </span>
                            </label>
                            <input type="number" id="min_voltage" name="min_voltage" required step="any">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group" style="animation-delay: 0.6s;">
                            <label for="time_at_415v">Time at 4.15V (s)
                                <span class="tooltip">ⓘ
                                    <span class="tooltiptext">Duration the battery maintains at 4.15V</span>
                                </span>
                            </label>
                            <input type="number" id="time_at_415v" name="time_at_415v" required step="any">
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group" style="animation-delay: 0.7s;">
                            <label for="time_constant_current">Time constant current (s)
                                <span class="tooltip">ⓘ
                                    <span class="tooltiptext">Duration of constant current phase during charging</span>
                                </span>
                            </label>
                            <input type="number" id="time_constant_current" name="time_constant_current" required step="any">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group" style="animation-delay: 0.8s;">
                            <label for="charging_time">Charging time (s)
                                <span class="tooltip">ⓘ
                                    <span class="tooltiptext">Total time to complete charging cycle</span>
                                </span>
                            </label>
                            <input type="number" id="charging_time" name="charging_time" required step="any">
                        </div>
                    </div>
                </div>
                
                <div class="form-group" style="animation-delay: 0.9s;">
                    <button type="submit" id="submitBtn">Predict Remaining Useful Life</button>
                </div>
            </form>
            
            <div class="loading" id="loadingIndicator">
                <div class="loading-spinner"></div>
                <p>Calculating prediction...</p>
            </div>
        </div>
    </div>

    <script>
        // Animate form groups on load
        document.addEventListener('DOMContentLoaded', function() {
            const formGroups = document.querySelectorAll('.form-group');
            formGroups.forEach((group, index) => {
                setTimeout(() => {
                    group.style.opacity = '1';
                }, 100 * index);
            });
        });

        // Button ripple effect
        document.getElementById('submitBtn').addEventListener('click', function(e) {
            const button = this;
            const x = e.clientX - button.getBoundingClientRect().left;
            const y = e.clientY - button.getBoundingClientRect().top;
            
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            button.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
        
        // Form submission and loading indicator
        document.getElementById('batteryForm').addEventListener('submit', function(e) {
            // Show loading indicator
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('batteryForm').style.opacity = '0.5';
            
            // For demo purposes, we're not preventing default
            // as we want the form to actually submit
        });
        
        // Fill form with sample data for testing (remove in production)
        function fillSampleData() {
            document.getElementById('cycle_index').value = '3';
            document.getElementById('discharge_time').value = '7393.76';
            document.getElementById('decrement').value = '1112.992';
            document.getElementById('max_voltage').value = '4.249';
            document.getElementById('min_voltage').value = '3.224';
            document.getElementById('time_at_415v').value = '5508.993';
            document.getElementById('time_constant_current').value = '6762.02';
            document.getElementById('charging_time').value = '10420.38';
        }
        
        // Uncomment to auto-fill with sample data
        // fillSampleData();
    </script>
</body>
</html>
